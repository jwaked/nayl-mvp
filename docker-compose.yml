services:
  app:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      NODE_ENV: production
      SESSION_SECRET: replace-this-with-a-long-random-secret-before-sharing
      AUTO_VERIFY_BUSINESSES: "true"
    ports:
      - "8787:8787"
    volumes:
      - nayl-data:/app/.data
volumes:
  nayl-data:
