services:
  - type: web
    name: nayl
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_SECRET
        generateValue: true
      - key: DEFAULT_MARKET
        value: AE
      - key: DEFAULT_CITY
        value: Dubai
      - key: AUTO_VERIFY_BUSINESSES
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_DEEP_MODEL
        value: gpt-5.6-terra
      - key: CONNECTOR_TIMEOUT_MS
        value: "20000"
      - key: DEEP_SEARCH_TIMEOUT_MS
        value: "90000"
